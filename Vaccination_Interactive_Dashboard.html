<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Vaccination Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --navy:#1B4965; --teal:#2A9D8F; --orange:#F4A261; --red:#E76F51; --grey:#6B7280;
  --bg:#F7F9FA; --card:#FFFFFF; --border:#E2E8ED; --text:#1F2937;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1720; --card:#182430; --border:#2A3743; --text:#E5E9EC; }
}
:root[data-theme="dark"]{ --bg:#0F1720; --card:#182430; --border:#2A3743; --text:#E5E9EC; }
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  position:sticky; top:0; z-index:10; background:var(--navy); color:#fff;
  padding:14px 18px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
header h1{margin:0; font-size:18px;}
header p{margin:2px 0 0; font-size:12px; opacity:0.85;}
nav{
  display:flex; overflow-x:auto; gap:4px; background:var(--card); border-bottom:1px solid var(--border);
  position:sticky; top:56px; z-index:9; -webkit-overflow-scrolling:touch;
}
nav button{
  flex:0 0 auto; background:none; border:none; padding:12px 14px; font-size:13px; font-weight:600;
  color:var(--grey); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;
}
nav button.active{color:var(--navy); border-bottom-color:var(--orange);}
main{padding:16px; max-width:1100px; margin:0 auto;}
.page{display:none;}
.page.active{display:block;}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px;}
.kpi{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center;}
.kpi .val{font-size:22px; font-weight:700; color:var(--navy);}
.kpi .lbl{font-size:11px; color:var(--grey); margin-top:2px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:16px;}
.card h3{margin:0 0 4px; font-size:15px; color:var(--navy);}
.card .sub{font-size:12px; color:var(--grey); margin-bottom:10px;}
.chart-wrap{position:relative; height:280px;}
.grid2{display:grid; grid-template-columns:1fr; gap:16px;}
@media(min-width:760px){ .grid2{grid-template-columns:1fr 1fr;} }
table{width:100%; border-collapse:collapse; font-size:12px;}
th,td{padding:6px 8px; border-bottom:1px solid var(--border); text-align:left;}
th{color:var(--grey); font-weight:600;}
.badge{display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600;}
.badge.risk{background:#FCE9E5; color:var(--red);}
.note{font-size:12px; color:var(--grey); line-height:1.5;}
.overflow{overflow-x:auto;}
footer{text-align:center; font-size:11px; color:var(--grey); padding:20px 10px 30px;}
</style>
</head>
<body>
<header>
  <h1>Global Vaccination Data Dashboard</h1>
  <p>214 countries · 69 antigens · 13 diseases · 1980–2023 · WHO/UNICEF data</p>
</header>
<nav id="tabs"></nav>
<main id="pages"></main>
<footer>Interactive stand-in for the 5-page Power BI dashboard suite described in the accompanying report. Built directly from the cleaned SQL database (vaccination.db).</footer>

  mkChart('c_high', {type:'bar', data:{labels:DATA.antigen_high.labels, datasets:[{label:'Coverage %', data:DATA.antigen_high.values, backgroundColor:PAL[2]}]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, scales:{x:{max:100}}, plugins:{legend:{display:false}}}});
})();

// ---------------- Page 2: Trends & Drop-off ----------------
(function(){
  const el = document.getElementById('p2');
  el.innerHTML = `
    <div class="card"><h3>Global Coverage Trend, Key Antigens (2000–2023)</h3>
      <div class="chart-wrap"><canvas id="c_trend"></canvas></div></div>
    <div class="grid2">
      <div class="card"><h3>DTP Dose 1 → Dose 3 Drop-off</h3>
        <div class="chart-wrap"><canvas id="c_dropoff"></canvas></div></div>
      <div class="card"><h3>Measles Booster (Dose 2) Uptake</h3>
        <div class="chart-wrap"><canvas id="c_booster"></canvas></div></div>
    </div>
    <div class="card"><p class="note"><b>Answers:</b> "What is the drop-off rate between 1st and subsequent doses?" and "Has booster dose uptake increased over time?" — the DTP1→DTP3 gap narrowed from 6 to 4 points (2009-2018) then widened post-pandemic; measles 2nd-dose coverage nearly doubled from 40% (2009) to 74% (2023).</p></div>
  `;
  const gt = DATA.global_trend;
  mkChart('c_trend', {type:'line', data:{labels:gt.years, datasets:Object.keys(gt.series).map((k,i)=>({label:k, data:gt.series[k], borderColor:PAL[i%PAL.length], backgroundColor:'transparent', tension:0.2}))},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}}});
  const dd = DATA.dtp_dropoff;
  mkChart('c_dropoff', {type:'line', data:{labels:dd.years, datasets:[
      {label:'DTP Dose 1', data:dd.dtp1, borderColor:PAL[0], backgroundColor:'transparent'},
      {label:'DTP Dose 3', data:dd.dtp3, borderColor:PAL[4], backgroundColor:'rgba(231,111,81,0.15)', fill:'-1'}
    ]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}}});
  const mb = DATA.mcv_booster;
  mkChart('c_booster', {type:'line', data:{labels:mb.years, datasets:[
      {label:'Measles Dose 1', data:mb.mcv1, borderColor:PAL[0], backgroundColor:'transparent'},
      {label:'Measles Dose 2 (booster)', data:mb.mcv2, borderColor:PAL[5], backgroundColor:'transparent'}
    ]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}}});
})();

// ---------------- Page 3: Regional ----------------
(function(){

  el.innerHTML = `
    <div class="grid2">
      <div class="card"><h3>DTP3 Coverage by WHO Region</h3><div class="sub">${DATA.kpi_latest_year}, vs 95% WHO target</div>
        <div class="chart-wrap"><canvas id="c_region"></canvas></div></div>

// ---------------- Page 4: Coverage vs Incidence ----------------
(function(){
  const el = document.getElementById('p4');
  const flagsRows = DATA.outbreak_flags.map(r=>`<tr><td>${r.name}</td><td>${r.year}</td><td>${r.cov}%</td><td>${r.inc}</td><td><span class="badge risk">High incidence</span></td></tr>`).join('');
  el.innerHTML = `
    <div class="grid2">
      <div class="card"><h3>DTP3 Coverage vs Pertussis Incidence</h3><div class="sub">country-years, log scale</div>
        <div class="chart-wrap"><canvas id="c_scatter1"></canvas></div></div>
      <div class="card"><h3>MCV1 Coverage vs Measles Incidence</h3><div class="sub">country-years, log scale</div>
        <div class="chart-wrap"><canvas id="c_scatter2"></canvas></div></div>
    </div>
    <div class="card"><h3>Global Reported Cases Over Time</h3><div class="sub">log scale</div>
      <div class="chart-wrap"><canvas id="c_cases"></canvas></div></div>
    <div class="card"><h3>Outbreak-Risk Alert: High Coverage, High Incidence (2018+)</h3>
      <div class="overflow"><table><thead><tr><th>Country</th><th>Year</th><th>MCV1 Coverage</th><th>Measles Incidence</th><th>Flag</th></tr></thead>
      <tbody>${flagsRows}</tbody></table></div>
      <p class="note" style="margin-top:8px;">These countries reported ≥90% measles coverage yet experienced major outbreaks — a signal of sub-national coverage gaps, waning immunity, or reporting artifacts, not visible from the national average alone.</p>
    </div>
  `;
  mkChart('c_scatter1', {type:'scatter', data:{datasets:[{label:'DTP3 vs Pertussis', data:DATA.scatter_dtp_pertussis.map(p=>({x:p[0],y:p[1]})), backgroundColor:'rgba(27,73,101,0.35)'}]},
    options:{responsive:true, maintainAspectRatio:false, scales:{y:{type:'logarithmic', title:{display:true,text:'Incidence (log)'}}, x:{title:{display:true,text:'Coverage %'}}}, plugins:{legend:{display:false}}}});
  mkChart('c_scatter2', {type:'scatter', data:{datasets:[{label:'MCV1 vs Measles', data:DATA.scatter_mcv_measles.map(p=>({x:p[0],y:p[1]})), backgroundColor:'rgba(142,68,173,0.35)'}]},
    options:{responsive:true, maintainAspectRatio:false, scales:{y:{type:'logarithmic', title:{display:true,text:'Incidence (log)'}}, x:{title:{display:true,text:'Coverage %'}}}, plugins:{legend:{display:false}}}});
  const ct = DATA.cases_trend;
  mkChart('c_cases', {type:'line', data:{labels:ct.years, datasets:Object.keys(ct.series).map((k,i)=>({label:k, data:ct.series[k], borderColor:PAL[i%PAL.length], backgroundColor:'transparent', tension:0.15}))},
    options:{responsive:true, maintainAspectRatio:false, scales:{y:{type:'logarithmic'}}, plugins:{legend:{position:'bottom'}}}});
})();

// ---------------- Page 5: Vaccine Introduction & Correlation ----------------
(function(){
  const el = document.getElementById('p5');
  const corr = DATA.correlation;
  let rows = corr.labels.map((rowLbl,i)=>{
    const cells = corr.matrix[i].map(v=>{
      const c = v>0 ? `rgba(231,111,81,${Math.min(Math.abs(v),1)*0.6})` : `rgba(27,73,101,${Math.min(Math.abs(v),1)*0.6})`;
      return `<td style="background:${c}; text-align:center;">${v.toFixed(2)}</td>`;
    }).join('');
    return `<tr><th>${rowLbl}</th>${cells}</tr>`;
  }).join('');
  const header = '<th></th>' + corr.labels.map(l=>`<th>${l}</th>`).join('');
  el.innerHTML = `
    <div class="card"><h3>Rotavirus Introduction Rate by WHO Region</h3>
      <div class="chart-wrap"><canvas id="c_rota2"></canvas></div>
      <p class="note">Answers: "Is there a correlation between vaccine introduction and a decrease in disease cases?" and "Are there disparities in introduction timelines across WHO regions?"</p>
    </div>
    <div class="card"><h3>Correlation: Vaccine Coverage vs Disease Incidence</h3>
      <div class="overflow"><table><thead><tr>${header}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note" style="margin-top:8px;">Coverage across antigens is strongly self-correlated (health-system capacity signal); coverage-vs-incidence correlations are consistently negative but modest, reflecting other drivers (reporting quality, sub-national gaps, waning immunity).</p>
    </div>
  `;
  const ri = DATA.rota_intro;
  mkChart('c_rota2', {type:'bar', data:{labels:ri.regions, datasets:[{label:'% introduced', data:ri.values, backgroundColor:PAL[3]}]},
    options:{responsive:true, maintainAspectRatio:false, scales:{y:{max:100}}, plugins:{legend:{display:false}}}});
})();
</script>
